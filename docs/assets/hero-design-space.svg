<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d">
<title id="t">ExperimentAdvisor</title>
<desc id="d">Left: a design space holding round one - three replicates clustered at the baseline, one-factor arms along each axis, and a few scattered combination points. Right: the same space with an infeasible band excluded along the bottom, a response-surface star around the best region, and a scattered optimisation batch beside it.</desc>
