    .base{fill:#e8e6e0} .ofat{fill:#8b8b85} .lhs{fill:#5f5e5a}
    .ccd{stroke:#2fa88f} .bo{fill:#5DCAA5}
    .bad{fill:#1a1a1e} .badline{stroke:#EF9F27} .arw{fill:#4a4a46}
