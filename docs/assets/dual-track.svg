<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
<title id="t">Both tracks kept: the choice waits until the data can make it</title>
<desc id="d">Round one results do not exist yet. Response surfaces explain mechanism but need a larger sample and an exactly executed design; Bayesian optimisation works on small samples and arbitrary conditions but explains little. Both run on shared data rather than splitting the sample budget.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" class="arh"/></marker></defs>
<style>
  .bg{fill:#ffffff}
  .pend{fill:#fdf6e8;stroke:#BA7517;stroke-width:1.5;stroke-dasharray:6 4}
  .box{fill:#f4f2ec;stroke:#d8d5cc;stroke-width:1}
  .fl{stroke:#8b8b85;stroke-width:1.6;fill:none}
  .arh{fill:#8b8b85}
  .ti{fill:#2c2c2a;font:500 15px system-ui,-apple-system,'Segoe UI',sans-serif}
  .sim{fill:#8b8b85;font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;font-style:italic}
  .h{fill:#2c2c2a;font:500 14px system-ui,-apple-system,'Segoe UI',sans-serif}
  .warn{fill:#8a5a00;font:500 13px system-ui,-apple-system,'Segoe UI',sans-serif}
  .s{fill:#5f5e5a;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
  .note{fill:#5f5e5a;font:400 11.5px system-ui,-apple-system,'Segoe UI',sans-serif}
  .ok{fill:#0F766E} .bad{fill:#B4B2A9}
  .okt{fill:#0F766E;font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117} .pend{fill:#241c0c;stroke:#EF9F27} .box{fill:#1c1f26;stroke:#3a3d44}
    .fl{stroke:#8b8b85} .arh{fill:#8b8b85}
    .ti{fill:#e8e6e0} .sim{fill:#8b8b85} .h{fill:#e8e6e0} .warn{fill:#EF9F27}
    .s{fill:#b4b2a9} .note{fill:#b4b2a9} .ok{fill:#2fa88f} .bad{fill:#5f5e5a} .okt{fill:#5DCAA5}
  }
</style>
<rect class="bg" x="0" y="0" width="700" height="400"/>
<text class="ti" x="20" y="26">Both tracks kept — not indecision, the basis for choosing does not exist yet</text>
<text class="sim" x="20" y="44">Trade-off per the project lead; the side-by-side rule is in the round2_design.py module docstring</text>

<rect class="pend" x="238" y="62" width="224" height="50" rx="7"/>
<text class="warn" x="350" y="84" text-anchor="middle">round 1 measured results</text>
<text class="s" x="350" y="102" text-anchor="middle">not in yet — hence half-finished</text>

<path class="fl" d="M 300 114 L 205 158" marker-end="url(#a)"/>
<path class="fl" d="M 400 114 L 495 158" marker-end="url(#a)"/>

<rect class="box" x="34" y="162" width="292" height="126" rx="7"/>
<text class="h" x="52" y="186">response surface (CCD)</text>
<circle class="ok" cx="58" cy="209" r="4"/><text class="s" x="70" y="213">explains mechanism: factors, effects</text>
<circle class="bad" cx="58" cy="233" r="4"/><text class="s" x="70" y="237">needs a larger sample</text>
<circle class="bad" cx="58" cy="257" r="4"/><text class="s" x="70" y="261">design must be executed exactly</text>

<rect class="box" x="374" y="162" width="292" height="126" rx="7"/>
<text class="h" x="392" y="186">Bayesian optimisation</text>
<circle class="ok" cx="398" cy="209" r="4"/><text class="s" x="410" y="213">converges on good parameters fast</text>
<circle class="ok" cx="398" cy="233" r="4"/><text class="s" x="410" y="237">small samples, arbitrary conditions</text>
<circle class="bad" cx="398" cy="257" r="4"/><text class="s" x="410" y="261">explains little</text>

<line x1="34" y1="312" x2="666" y2="312" stroke="#e0ded7" stroke-width="1"/>
<text class="okt" x="34" y="336">Both run on shared data; the round's sample budget is not split between them.</text>
<text class="note" x="34" y="360">The strengths are complementary, and which is viable depends on how round one turns out: executed</text>
<text class="note" x="34" y="380">exactly with clear effects favours the surface; drift or noise leaves only the optimiser. No budget to bet.</text>
</svg>
